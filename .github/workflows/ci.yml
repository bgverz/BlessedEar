name: CI

on:
  push:
    branches: [main, "recommendation-engine-fix"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency security scan (pip-audit)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 --ignore-vuln CVE-2024-23342
        continue-on-error: false

      - name: Run tests
        env:
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          JWT_SECRET_KEY: test_jwt_secret_for_ci_only_not_production
          DATABASE_URL: sqlite:///./test_ci.db
          REDIS_URL: redis://localhost:6379
          DEBUG: "false"
        run: python -m pytest tests/ -v --tb=short

      - name: Verify Alembic migration applies cleanly
        env:
          DATABASE_URL: sqlite:///./test_migration_ci.db
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          JWT_SECRET_KEY: test_jwt_secret_for_ci_only_not_production
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
