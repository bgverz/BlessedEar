# docker-compose.yml — LOCAL DEVELOPMENT ONLY
#
# Do NOT use this file in production.  For production, copy .env.example to
# .env, fill in real secrets, and run:
#   docker compose -f docker-compose.prod.yml up -d
#
# All services here use hot-reload and default credentials suitable for local
# dev only.  No volumes are persisted across `docker compose down -v`.

version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: blessedear
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # dev only — change in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blessedear
      - REDIS_URL=redis://redis:6379
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/callback}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEBUG=true         # dev only — NEVER set true in production
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app    # hot-reload — remove in production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run Alembic migrations before starting the server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules  # preserve container node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
